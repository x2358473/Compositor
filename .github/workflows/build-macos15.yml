name: Build for macOS 15

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: macos15-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build (macOS 15+, Apple silicon)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The newest Xcode the runner has: the sources are written against the macOS 26 SDK, and
      # SWIFT_DEFAULT_ACTOR_ISOLATION (a Swift 6.2 setting the project relies on) needs it. Only the
      # deployment target is lowered, so everything the SDK marks as macOS 26 is caught at build time.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # Signing happens by hand below: the project asks for a development team, which a runner has not.
      # Every error is also raised as an annotation, so a failed build is readable without the job's log.
      - name: Build (Release, arm64)
        run: |
          xcodebuild build \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath DerivedData \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_COVERAGE=NO > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exited with $STATUS"
          # Annotations are the one part of a failed run readable without a token, so the errors are
          # repeated here, and the tail of the log when xcodebuild failed without saying "error:".
          MESSAGE=$(grep -E "error:" build.log | head -10)
          if [ -z "$MESSAGE" ]; then MESSAGE=$(tail -10 build.log); fi
          echo "$MESSAGE" | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -60 build.log
          exit $STATUS

      # A private repository hides a job's log behind a token; an artifact's name does not, so the first
      # error the build reported goes into it.
      - name: Upload build log
        if: failure()
        run: |
          NAME=$(grep -m1 "error:" build.log | tr '/:' '__' | tr -cd 'A-Za-z0-9 ._,()[]=-' | cut -c1-120)
          if [ -z "$NAME" ]; then NAME=$(tail -1 build.log | tr '/:' '__' | tr -cd 'A-Za-z0-9 ._,()[]=-' | cut -c1-120); fi
          echo "LOG_NAME=${NAME:-build-log}" >> "$GITHUB_ENV"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LOG_NAME || 'build-log' }}
          path: build.log
          retention-days: 7

      # The branch is not one the workflow runs on, so this cannot start another run; it is where the
      # errors are read from while iterating on the deployment target.
      - name: Record the build errors
        if: failure()
        run: |
          {
            echo "=== error lines ==="
            grep -E "error:" build.log | head -100 || true
            echo
            echo "=== last 100 lines ==="
            tail -100 build.log
          } > build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f build-errors.txt
          git commit -m "Record the macOS 15 build errors" --allow-empty
          git push -f origin ci-log

      - name: Sign the app
        run: |
          APP=DerivedData/Build/Products/Release/Compositor.app
          test -d "$APP"
          codesign --force --deep --sign - --options runtime \
            --entitlements Config/Compositor.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Fails the run if the binary still asks for macOS 26, or if it lost the sandbox entitlements.
      - name: Verify the deployment target
        run: |
          APP=DerivedData/Build/Products/Release/Compositor.app
          vtool -show-build "$APP/Contents/MacOS/Compositor" | tee build-info.txt
          grep -q 'minos 15.0' build-info.txt
          codesign -d --entitlements - "$APP" 2>&1 | tee entitlements.txt
          grep -q 'app-sandbox' entitlements.txt

      - name: Package
        run: |
          APP=DerivedData/Build/Products/Release/Compositor.app
          VERSION=$(grep -m1 'MARKETING_VERSION = ' Compositor.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Compositor-${VERSION}-macOS15-arm64.zip"
          hdiutil create -volname "Compositor" -srcfolder "$APP" -ov -format UDZO \
            "dist/Compositor-${VERSION}-macOS15-arm64.dmg"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-macOS15-arm64
          path: dist/*
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Compositor ${{ env.VERSION }} built for **macOS 15 and later on Apple silicon**.

            Built from upstream source with the deployment target lowered to 15.0 and the
            macOS 26-only APIs behind availability checks.

            The app is signed ad hoc, so the first launch needs **right-click → Open**, or run:

            ```
            xattr -dr com.apple.quarantine /Applications/Compositor.app
            ```
